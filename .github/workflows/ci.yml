name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-24.04
    name: Plan runners
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Plan runners
        id: plan
        uses: selectiveci/setup-selective/plan@v1
        with:
          api-key: ${{ secrets.SELECTIVE_API_KEY }}
          max-runners: 4
          target-seconds: 60

  rspec:
    needs: [plan]
    runs-on: ubuntu-24.04
    name: RSpec (runner ${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      RAILS_ENV: test
      # The weekly run refreshes Selective's view of the suite.
      SELECTIVE_TEST_MAP_RECORD: ${{ github.event_name == 'schedule' && '1' || '' }}
    steps:
      - uses: actions/checkout@v6

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Set up Selective
        uses: selectiveci/setup-selective@v1
        with:
          api-key: ${{ secrets.SELECTIVE_API_KEY }}
          runner-id: ${{ matrix.runner }}

      - name: Prepare the database
        run: bin/rails db:schema:load

      - name: Run the specs
        run: bundle exec selective rspec

  # The runner count changes from build to build, so branch protection requires
  # this job rather than each runner.
  rspec-passed:
    needs: [rspec]
    if: always()
    runs-on: ubuntu-24.04
    name: RSpec
    steps:
      - run: test "${{ needs.rspec.result }}" = success
